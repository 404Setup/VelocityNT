name: Native Build Workflow

on: [push, pull_request]
permissions: write-all

jobs:
  build:
    if: "contains(github.event.commits[0].message, '[native build]')"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-20.04
            arch: x86_64
          - os: ubuntu-20.04
            arch: arm64
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04
            arch: arm64
          - os: macos-latest
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12.1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Update C/C++ toolchain for Ubuntu
        if: startsWith(matrix.os, 'ubuntu-20.04')
        run: |
          sudo apt update
          sudo apt install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt update
          sudo apt install -y gcc-11 g++-11
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 110 \
                                 --slave /usr/bin/g++ g++ /usr/bin/g++-11 \
                                 --slave /usr/bin/gcov gcov /usr/bin/gcov-11
          sudo update-alternatives --auto gcc
        shell: bash

      - name: Update C/C++ toolchain for macOS
        if: runner.os == 'macOS'
        run: |
          brew install gcc@11
          echo "CC=gcc-11" >> $GITHUB_ENV
          echo "CXX=g++-11" >> $GITHUB_ENV
        shell: bash

      - name: Setup Powershell
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            brew install powershell/tap/powershell
          else
            sudo apt-get update
            sudo apt-get install -y wget apt-transport-https software-properties-common
            source /etc/os-release
            wget -q https://packages.microsoft.com/config/ubuntu/$VERSION_ID/packages-microsoft-prod.deb
            sudo dpkg -i packages-microsoft-prod.deb
            rm packages-microsoft-prod.deb
            sudo apt-get update
            sudo apt-get install -y powershell
          fi
        shell: bash

      - name: Configure Git User Details
        run: git config --global user.email "no-reply@tranic.one" && git config --global user.name "TranicDev"

      - name: Setup Build Tools
        uses: lukka/get-cmake@latest

      - name: Build Process
        shell: pwsh
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          CC: ${{ env.CC }}
          CXX: ${{ env.CXX }}
        run: |
          $buildScript = @'
          $ErrorActionPreference = 'Stop'
          
          Write-Host "Verifying Java environment..."
          java -version
          Write-Host "JAVA_HOME: $env:JAVA_HOME"
          
          Push-Location native
          
          Move-Item CMakeLists.compress.txt CMakeLists.txt
          cmake -B build
          cmake --build build --config Debug
          
          function Move-BuildOutput {
              param (
                  [string]$SourcePath,
                  [string]$TargetDir,
                  [string]$FilePattern,
                  [switch]$RemoveLib
              )
          
              if (!(Test-Path $TargetDir)) {
                  New-Item -ItemType Directory -Path $TargetDir -Force
              }
          
              Get-ChildItem -Path $SourcePath -Filter $FilePattern | ForEach-Object {
                  $targetName = $_.Name
                  if ($RemoveLib) {
                      $targetName = $targetName -replace '^lib',''
                  }
                  $targetPath = Join-Path $TargetDir $targetName
                  if (Test-Path $targetPath) {
                      Remove-Item $targetPath -Force
                  }
                  Move-Item $_.FullName $targetPath -Force
              }
          }
          
          $osType = if ($IsMacOS) { "macos" } else { "linux" }
          Move-BuildOutput -SourcePath "build" -TargetDir "src/main/resources/${osType}_${{ matrix.arch }}" -FilePattern "libvelocity-compress.*" -RemoveLib
          
          Remove-Item -Recurse -Force build
          Remove-Item -Recurse -Force CMakeLists.txt
          Move-Item CMakeLists.openssl.txt CMakeLists.txt
          
          cmake -B build
          cmake --build build
          
          $osType = if ($IsMacOS) { "macos" } else { "linux" }
          Move-BuildOutput -SourcePath "build" -TargetDir "src/main/resources/${osType}_${{ matrix.arch }}" -FilePattern "libvelocity-cipher*" -RemoveLib
          
          Remove-Item -Recurse -Force build
          Remove-Item -Recurse -Force CMakeLists.txt
          
          Pop-Location
          ./gradlew test
          
          if ($LASTEXITCODE -eq 0) {
              Push-Location native
              $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
              $osType = if ($IsMacOS) { "macos" } else { "linux" }
              $zipName = "native-pak-${osType}-${timestamp}-${{ matrix.arch }}.zip"
              Compress-Archive -Path "src/main/resources/*" -DestinationPath $zipName -Force
              Pop-Location
          }
          '@
          
          $buildScript | Out-File -FilePath build.ps1
          pwsh -File build.ps1

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: native-builds-${{ matrix.os }}-${{ matrix.arch }}
          path: native/native-pak-*.zip
